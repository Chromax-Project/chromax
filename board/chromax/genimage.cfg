image efi-part.vfat {
    vfat {
        extraargs = "-n CHROMAXEFI"
        file EFI { image = "efi-part/EFI" }
        file kernel { image = "efi-part/kernel" }
    }
    size = 128M
}
image chromax.img {
    hdimage { partition-table-type = "gpt" }
    partition boot {
        image = "efi-part.vfat"
        partition-type-uuid = U
        offset = 1M
        bootable = true
    }
    partition root {
        image = "rootfs.ext4"
        partition-type-uuid = L
        partition-uuid = ROOT_UUID
    }
}
