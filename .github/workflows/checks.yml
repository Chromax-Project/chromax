name: Interface and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile Python modules
        run: python3 -m compileall -q src
      - name: Test policy, HTTP boundaries and signed packages
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          for script in board/chromax/*.sh rootfs-overlay/etc/init.d/S*; do sh -n "$script"; done
